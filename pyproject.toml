[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-intel"
version = "0.1.0"
description = "Fantasy Football Intelligence Agent - Under-the-radar waiver wire detection, buy-low/sell-high trade analyzer, and news context engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "nfl_data_py>=0.3.2",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "feedparser>=6.0.10",
    "beautifulsoup4>=4.12.0",
    "fastparquet>=2024.2.0",
]

[project.scripts]
fantasy-intel = "fantasy_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
